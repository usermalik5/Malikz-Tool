name: Deploy private Cloudflare service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/configure_worker.py'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Configure the D1 identifier and site origin
        working-directory: .
        run: python scripts/configure_worker.py
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          MALIKZ_ADMIN_EMAIL: ${{ secrets.MALIKZ_ADMIN_EMAIL }}
          MALIKZ_SITE_ORIGIN: ${{ secrets.MALIKZ_SITE_ORIGIN }}
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply malikz-tool --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create the Worker before adding its secret bindings
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker secrets
        shell: bash
        run: |
          [[ ${#SESSION_SECRET} -ge 32 ]] || { echo "MALIKZ_SESSION_SECRET must have at least 32 characters"; exit 1; }
          [[ ${#API_PROXY_SECRET} -ge 32 ]] || { echo "MALIKZ_PROXY_SECRET must have at least 32 characters"; exit 1; }
          if [[ -n "$BOOTSTRAP_SECRET" && ${#BOOTSTRAP_SECRET} -lt 32 ]]; then echo "MALIKZ_BOOTSTRAP_SECRET must have at least 32 characters"; exit 1; fi
          if [[ -n "$BOOTSTRAP_SECRET" ]]; then printf '%s' "$BOOTSTRAP_SECRET" | npx wrangler secret put BOOTSTRAP_SECRET; fi
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$API_PROXY_SECRET" | npx wrangler secret put API_PROXY_SECRET
        env:
          BOOTSTRAP_SECRET: ${{ secrets.MALIKZ_BOOTSTRAP_SECRET }}
          SESSION_SECRET: ${{ secrets.MALIKZ_SESSION_SECRET }}
          API_PROXY_SECRET: ${{ secrets.MALIKZ_PROXY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
